<div class="d-flex align-items-center justify-content-between pe-2">
  <h2 mat-dialog-title class="mb-0">Images</h2>
  <button mat-icon-button mat-dialog-close type="button" aria-label="Close">
    <mat-icon>close</mat-icon>
  </button>
</div>

<mat-dialog-content class="p-0">
  <div class="row g-0">
    <div class="col-12 col-md-8 p-4">
      <!-- image list goes here, call select(image.url) on click -->
    </div>

    <div class="col-12 col-md-4 p-4 bg-light">
      <h4>Upload Image</h4>
      <form>
        <div class="mt-3">
          <input type="file" class="form-control">
        </div>
        <div class="mt-3">
          <input type="text" class="form-control" placeholder="file name">
        </div>
        <div class="mt-3">
          <input type="text" class="form-control" placeholder="Title">
        </div>
        <div class="mt-3">
          <button type="submit" class="btn btn-dark">Upload</button>
        </div>
      </form>
    </div>
  </div>
</mat-dialog-content>
