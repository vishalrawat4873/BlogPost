<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">

            <h1 class="h3 mb-4">Add Category</h1>

            <form action="/categories" method="post" class="needs-validation" novalidate>

                <div class="card shadow-sm">
                    <div class="card-body p-4">

                        <!-- Name -->
                        <div class="mb-3">
                            <label for="categoryName" class="form-label">
                                Name <span class="text-danger">*</span>
                            </label>
                            <input
                                type="text"
                                class="form-control"
                                id="categoryName"
                                name="name"
                                placeholder="e.g. Men's Clothing"
                                maxlength="100"
                                required
                                autofocus>
                            <div class="invalid-feedback">
                                Please enter a category name.
                            </div>
                        </div>

                        <!-- Slug -->
                        <div class="mb-3">
                            <label for="categorySlug" class="form-label">
                                URL Handle (slug) <span class="text-danger">*</span>
                            </label>
                            <div class="input-group">
                                <span class="input-group-text">/category/</span>
                                <input
                                    type="text"
                                    class="form-control"
                                    id="categorySlug"
                                    name="slug"
                                    placeholder="mens-clothing"
                                    pattern="[a-z0-9]+(?:-[a-z0-9]+)*"
                                    maxlength="120"
                                    aria-describedby="slugHelp"
                                    required>
                                <div class="invalid-feedback">
                                    Use only lowercase letters, numbers, and hyphens.
                                </div>
                            </div>
                            <div id="slugHelp" class="form-text">
                                Auto-generated from the name. You can edit it.
                            </div>
                        </div>

                    </div>

                    <div class="card-footer bg-transparent d-flex justify-content-end gap-2 p-3">
                        <a href="/categories" class="btn btn-outline-secondary">Cancel</a>
                        <button type="submit" class="btn btn-primary">Save</button>
                    </div>
                </div>

            </form>
        </div>
    </div>
</div>
